<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Svelte app</title>

  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="stylesheet" href="/build/bundle.css">

  <!-- 1) Include DOMPurify (needed by jsPDF's .html() method) -->
  <script src="https://cdn.jsdelivr.net/npm/dompurify@2.4.0/dist/purify.min.js"></script>

  <!-- 2) Include html2canvas (for rendering elements/images to canvas in jsPDF) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <!-- 3) Include jsPDF (the PDF generation library) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- Your Svelte bundle (make sure it's loaded after the above libraries) -->
  <script defer src="/build/bundle.js"></script>
</head>
<body>
</body>
</html>
